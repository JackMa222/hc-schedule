<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <title>2026 Holiday Club</title>
</head>

<body class="bg-2026">
    <div class="d-flex justify-content-center">
        <div class="w-90 title-bg-2026 p-2 m-3 ps-5 pe-5 rounded text-center">
            <h1 class="text-black">Holiday Club: 2026</h1>
        </div>
    </div>
    <div class="d-flex justify-content-center p-2">
        <h1 id="curr" class="text-center fw-semibold text-wrap display-1">Current Activity</h1>
    </div>

    <div class="d-flex justify-content-center p-2 pb-0">
        <h4 id="prev" class="bg-black p-2 m-2 rounded text-center">Previous: ...</h4>
        <h4 id="next" class="bg-black p-2 m-2 rounded text-center">Next: ...</h4>
    </div>
    <div class="d-flex flex-row justify-content-center p-2">
        <div class="p-2 m-2 rounded text-center">
            <h4 id="elap" class="display-1" style="min-width: 8ch">--:--:--</h4>
            <h6>Elapsed session time</h6>
        </div>
        <div class="p-2 m-2 rounded text-center">
            <h4 id="down" class="display-1" style="min-width: 8ch">--:--:--</h4>
            <h6>Time till next session</h6>
        </div>
        <!--
        <div class="p-2 m-2 rounded text-center">
            <h4 id="timecurrent" class="display-1" style="min-width: 8ch">--:--:--</h4>
            <h6>Current Time</h6>
        </div>
        -->
    </div>
    <div id="group_activity" class="d-flex flex-column justify-content-center p-2">
        <div class="d-flex flex-row justify-content-center">
            <div class="red p-2 m-2 rounded text-center">
                <h2 id="red_group">Red: --</h2>
            </div>
            <div class="blue p-2 m-2 rounded text-center">
                <h2 id="blue_group" >Blue: --</h2>
            </div>
        </div>
        <div class="d-flex flex-row justify-content-center">
            <div class="green p-2 m-2 rounded text-center">
                <h2 id="green_group">Green: --</h2>
            </div>
            <div class="yellow p-2 m-2 rounded text-center text-black">
                <h2 id="yellow_group" >Yellow: --</h2>
            </div>
        </div>
        <div class="d-flex flex-row justify-content-center">
            <div class="purple p-2 m-2 rounded text-center">
                <h2 id="purple_group">Purple: --</h2>
            </div>
            <div class="magenta p-2 m-2 rounded text-center">
                <h2 id="magenta_group" >Magenta: --</h2>
            </div>
        </div>
    </div>

    <script>
    const roomNames = {
        learning1: "Teaching Time 1",
        learning2: "Teaching Time 2",
        craft: "Craft",
        activity: "Activity Centre",
        games: "Games"
    }

    const events = [
        { timestamp: '08:30:00', title: 'Team Devotions'},
        { timestamp: '09:00:00', title: 'Registration'},
        { timestamp: '09:30:00', title: 'Session'},
        { timestamp: '09:55:00', title: 'Group Time 1', red: roomNames.learning1, blue: roomNames.learning2, green: roomNames.craft, yellow: roomNames.activity, magenta: roomNames.games, purple: roomNames.games},
        { timestamp: '10:20:00', title: 'Group Time 2', red: roomNames.learning2, blue: roomNames.learning1, green: roomNames.activity, yellow: roomNames.craft, magenta: roomNames.games, purple: roomNames.games},
        { timestamp: '10:45:00', title: 'Group Time 3', red: roomNames.games, blue: roomNames.games, green: roomNames.learning1, yellow: roomNames.learning2, magenta: roomNames.craft, purple: roomNames.activity},
        { timestamp: '11:10:00', title: 'Morning Tea'},
        { timestamp: '11:30:00', title: 'Group Time 4', red: roomNames.games, blue: roomNames.games, green: roomNames.learning2, yellow: roomNames.learning1, magenta: roomNames.craft, purple: roomNames.activity},
        { timestamp: '11:55:00', title: 'Group Time 5', red: roomNames.craft, blue: roomNames.activity, green: roomNames.games, yellow: roomNames.games, magenta: roomNames.learning1, purple: roomNames.learning2},
        { timestamp: '12:20:00', title: 'Group Time 6', red: roomNames.activity, blue: roomNames.craft, green: roomNames.games, yellow: roomNames.games, magenta: roomNames.learning2, purple: roomNames.learning1},
        { timestamp: '12:45:00', title: 'Session'},
        { timestamp: '13:00:00', title: 'Finish & Drop Off'},
        { timestamp: '13:15:00', title: 'Debrief/Meeting/Pack-up'},
        { timestamp: '19:00:00', title: 'Family Night'},
    ];

    function convertTimestamp(ts) {
        const [h, m, s] = ts.split(':').map(Number);
        return h * 3600 + m * 60 + s;
    }

    function convertSeconds(secs) {
        // console.log(secs);
        hours = Math.floor(secs/3600);
        // console.log(hours);
        minutes = Math.floor((secs % 3600) / 60);
        remainingSeconds = secs % 60;

        if (hours < 10) {
            hours = '0' + hours;
        }
        if (minutes < 10) {
            minutes = '0' + minutes;
        }
        if (remainingSeconds < 10) {
            remainingSeconds = '0' + remainingSeconds;
        }

        return hours + ':' + minutes + ':' + remainingSeconds;
    }

    function timeSince(timestamp) {
        date = new Date();
        str = date.getHours() + ':' + date.getMinutes() + ':' + date.getSeconds();
        now = convertTimestamp(str);
        //console.log(now);
        then = convertTimestamp(timestamp);
        //console.log(then);
        elapsed = now - then;
        return convertSeconds(elapsed);
    }

    function timeTill(timestamp) {
        date = new Date();
        str = date.getHours() + ':' + date.getMinutes() + ':' + date.getSeconds();
        now = convertTimestamp(str);
        //console.log(now);
        then = convertTimestamp(timestamp);
        //console.log(then);
        elapsed = then - now;
        return convertSeconds(elapsed);
    }

    // function to run every second

    const currentEl = document.getElementById('curr');
    const nextEl = document.getElementById('next');
    const prevEl = document.getElementById('prev');
    const elapEl = document.getElementById('elap');
    const downEl = document.getElementById('down');

    const redGroup = document.getElementById('red_group')
    const blueGroup = document.getElementById('blue_group')
    const greenGroup = document.getElementById('green_group')
    const yellowGroup = document.getElementById('yellow_group')
    const purpleGroup = document.getElementById('purple_group')
    const magentaGroup = document.getElementById('magenta_group')

    const activitySessions = document.getElementById('group_activity')

    const currentTime = document.getElementById('timecurrent')

    function updateData() {
        date = new Date()
        const pad = num => String(num).padStart(2, '0')
        let time = `${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`
        
        let currentEvent = null;
        let nextEvent = null;
        let prevEvent = null;

        if (time < events[0].timestamp) {
            currentEvent = { title: "Day hasn't started", timestamp: time};
            nextEvent = events[0]
            prevEvent = { title: "Yesterday" }
        } else if (time >= events[events.length - 1].timestamp) {
            currentEvent = events[events.length - 1];
            nextEvent = { title: "Tomorrow", timestamp: '23:59:59' };
            prevEvent = events[events.length - 2]
        } else {
            for (let i = 0; i < events.length - 1; i++) {
                if (time >= events[i].timestamp && time < events[i + 1].timestamp) {
                    currentEvent = events[i];
                    nextEvent = events[i + 1];
                    prevEvent = i > 0 ? events[i - 1] : { title: "Yesterday "};
                    break;
                }
            }
        }

        currentEl.textContent = currentEvent.title;
        nextEl.textContent = "Next: " + nextEvent.title;
        prevEl.textContent = "Previous: " + prevEvent.title;

        elapEl.textContent = timeSince(currentEvent.timestamp)
        downEl.textContent = timeTill(nextEvent.timestamp)

                
        if (currentEvent.title.includes("Group Time")) {
            activitySessions.classList.remove("hidden")

            redGroup.textContent = "Red: " + currentEvent.red;
            blueGroup.textContent = "Blue: " + currentEvent.blue;
            greenGroup.textContent = "Green: " + currentEvent.green;
            yellowGroup.textContent = "Yellow: " + currentEvent.yellow;
            purpleGroup.textContent = "Purple: " + currentEvent.purple;
            magentaGroup.textContent = "Magenta: " + currentEvent.magenta;
        } else {
            activitySessions.classList.add("hidden");
        }
    }

    // run updateData every second
    setInterval(updateData, 1000)

</script>
</body>

</html>
